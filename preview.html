<div class="timer" id="timer" role="status" aria-live="polite">
  <div><div class="small" id="timerLabel">Rest</div><div class="clock" id="timerClock">0:00</div></div>
  <div class="row"><button data-act="timeradd">+30 s</button><button data-act="timerstop">Done</button></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="celebrate" id="celebrate" role="dialog" aria-live="assertive"></div>
<nav class="tabs" aria-label="Main">
